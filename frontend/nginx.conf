server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Cold full-portal scans (health / scoring / probe) page ~26k
        # records sequentially and can run several minutes — must exceed
        # the slowest scan, or the UI 504s while the backend keeps working.
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }
}
